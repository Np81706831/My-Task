<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Form</title>
    <style>
        @font-face {
        font-family: "Arad";
        src: url(./font/AradVF.woff2)format("woff2");}
        body{
            direction: rtl;
            font-family: "Arad";
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(./Photos/back-color.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            
        }
        .fieldset{
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .input{
        border-radius: 10px;
   
        }
    </style>
</head>
<body>
    <form action="#" method="post">
        <fieldset class="fieldset">
            <legend>اطلاعات کاربری</legend>
            <label>نام : </label>
            <input type="text" class="input" autofocus required />
            <label>نام خانوادگی : </label>
            <input type="text" class="input" required />
            <label>سن : </label>
            <input type="number" required class="input"/>
        </fieldset>
         <fieldset class="fieldset">
            <legend>اطلاعات تحصیلی</legend>
            <select style="font-family: 'Arad';">
                <option>دیپلم</option>
                <option> کاردانی</option>
                <option>کارشناسی</option>
                <option>کارشناسی ارشد</option>
                <option>دکترا</option>
                <option>سایر...</option>
            </select>
            <label>نام دانشگاه: </label>
            <input type="text"  class="input" />
        </fieldset>
        <fieldset class="fieldset">
            <legend>جنسیت :</legend>
            <label>زن</label>
            <input type="radio" name="gender"  class="input" />
            <label>مرد</label>
            <input type="radio" name="gender"  class="input" />
        </fieldset>
        <fieldset>
            <legend>مهارت های شما</legend>
            <label>HTML</label>
            <input type="checkbox"  class="input" />
            <label>CSS</label>
            <input type="checkbox"  class="input" />
            <label>Java-Script</label>
            <input type="checkbox"  class="input" />
            <label>React</label>
            <input type="checkbox"  class="input" />
            <label>PHP</label>
            <input type="checkbox"  class="input" />
            <label>SQL</label>
            <input type="checkbox"  class="input" />
            <label>Laravel</label>
            <input type="checkbox"  class="input" /><br>
            <h4>توضیحات :</h4>
            <textarea style="width: 30%;"></textarea>
        </fieldset>
        <fieldset>
            <legend>راه های ارتباطی با شما</legend>
            <label for="tel">Phone number :</label>
            <input type="tel" id="tel" class="input" required/> 
            <label>Email :</label>
            <input type="email" class="input" required />
            <label>Linkdin :</label>
            <input type="url" class="input" />
            <label>GitHub :</label>
            <input type="url" class="input" />-
        </fieldset><br>
        <input type="submit" class="input"/>
        <input type="reset" class="input"/>
    </form>
</body>
</html>
