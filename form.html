<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Form</title>
    <link href="./css/style-form.css" type="text/css" rel="stylesheet"/>
</head>
<body>
    <form action="#" method="post"  name="form">
        <h1>تکمیل اطلاعات کاربری : </h1>
        <fieldset class="fieldset">
            <legend>اطلاعات کاربری</legend>
            <label for="name">نام : </label>
            <input type="text" class="input" id="name"  autofocus required />
            <label for="family">نام خانوادگی : </label>
            <input type="text" class="input" id="family"  required />
            <label for="age">سن : </label>
            <input type="number" required class="input" id="age"/>
        </fieldset>
         <fieldset class="fieldset">
            <legend>اطلاعات تحصیلی</legend>
            <select style="font-family: 'Arad';">
                <option>دیپلم</option>
                <option> کاردانی</option>
                <option>کارشناسی</option>
                <option>کارشناسی ارشد</option>
                <option>دکترا</option>
                <option>سایر...</option>
            </select>
            <label for="university">نام دانشگاه: </label>
            <input type="text" class="input" id="university" />
        </fieldset>
        <fieldset class="fieldset">
            <legend>جنسیت :</legend>
            <label for="woman">زن</label>
            <input type="radio" name="gender"  class="input" id="woman"/>
            <label for="man">مرد</label>
            <input type="radio" name="gender" class="input" id="man"/>
        </fieldset>
        <fieldset>
            <legend>مهارت های شما</legend>
            <label for="html">HTML</label>
            <input type="checkbox"  class="input" id="html"/>
            <label for="css">CSS</label>
            <input type="checkbox"  class="input" id="css" />
            <label for="java">Java-Script</label>
            <input type="checkbox"  class="input" id="java"/>
            <label for="react">React</label>
            <input type="checkbox"  class="input" id="react" />
            <label for="php">PHP</label>
            <input type="checkbox"  class="input" id="php"/>
            <label for="sql">SQL</label>
            <input type="checkbox"  class="input" id="sql" />
            <label for="laravel">Laravel</label>
            <input type="checkbox"  class="input" id="laravel"/><br>
            <h4>توضیحات :</h4>
            <textarea style="width: 30%;"></textarea>
        </fieldset>
        <fieldset>
            <legend>راه های ارتباطی با شما</legend>
            <label for="tel">Phone number :</label>
            <input type="tel" id="tel" class="input" required/> 
            <label for="email">Email :</label>
            <input type="email" class="input" id="email" required />
            <label for="linkdin">Linkdin :</label>
            <input type="url" class="input" id="linkdin"/>
            <label for="github">GitHub :</label>
            <input type="url" class="input" id="github"/>-
        </fieldset><br>
        <input type="submit" class="input"/>
        <input type="reset" class="input"/>
    </form>
</body>
</html>
